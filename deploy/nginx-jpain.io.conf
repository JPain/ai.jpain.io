# jpain.io -- "Notes from James Pain", James' blog with posts by him and by his AI,
# built by ../build.py. Installed to /etc/nginx/sites-available/jpain.io on Fern by
# deploy.sh. It borrows the perip_read / perip_conn zones and the filehost_json log
# format from /etc/nginx/conf.d/filehost-limits.conf (ops/filehost). The log format is
# shared by every site: add fields only.
#
# Since 2026-10 this is the merged blog: ai.jpain.io ("Notes from James' AI") moved in,
# and nginx-ai.jpain.io.conf now only redirects there to the same path here.
#
# URL contract:
#   /<slug>/ and /<slug>/index.md, files at /<slug>/<file>, /tags/<tag>/, /about/,
#   /colophon/, /feed.xml, /feed.json, /llms.txt, /robots.txt, /sitemap.xml.
#   Kept from Bear Blog by redirect: /blog/ (and its tag links /blog/?q=<tag>),
#   the feeds at /feed/, /atom/, /feed/?type=rss and /rss/.
# The format-negotiation demo in the compression post: its one negotiated.jpg address
# returns a different file per browser, so caches must be told (Vary). Keyed on the
# address requested ($request_uri), because $uri changes to the file actually sent.
# Sec-Fetch-Dest since 2026-09-28: the file host's decision ($fh_best) also uses it, so
# a link opened on its own in Firefox or Safari gets AVIF/JPEG XL, not the JPEG.
map $request_uri $jp_vary {
    default                          "";
    "~/negotiated\.jpg(\?|$)"        "Accept, User-Agent, Sec-Fetch-Dest";
}
# Each post's raw Markdown (/<slug>/index.md) names the HTML post as the canonical copy, so
# search engines index the post and machines can still read the source.
map $request_uri $jp_md_link {
    default                                   "";
    "~^(?<jp_md>/[a-z0-9-]+/)index\.md(\?.*)?$" "<https://jpain.io$jp_md>; rel=\"canonical\"";
}
# Bear's tag links, /blog/?q=<tag>, go to that tag's page when the tag looks like a tag
# slug (all of Bear's did once lowercased; nginx can't lowercase), else to the list of tags.
map $arg_q $jp_bear_tag {
    default                    /tags/;
    ""                         /;
    "~^(?<jp_t>[a-z0-9.-]+)$"  /tags/$jp_t/;
}

# The 404 page shows `curl -sI` output with these headers, so the server really sends
# them, on 404s only (empty, so absent, on everything else).
map $status $jp_x_reason { 404 "no such post, page, or tag"; default ""; }
map $status $jp_x_hint   { 404 "the index is at / and the feed at /feed.xml"; default ""; }
map $status $jp_x_note   { 404 "if a link on this site brought you here, that is a bug; tell James"; default ""; }

# One address per page: /index.html and /<slug>/index.html redirect to / and /<slug>/.
# Keyed on $request_uri: the index directive rewrites /slug/ to /slug/index.html
# internally, so a test on $uri would redirect every page to itself.
map $request_uri $jp_index_to {
    default                                   "";
    "~^(?<jp_idx>[^?]*/)index\.html(\?.*)?$"   $jp_idx;
}

server {
    listen 80;
    listen [::]:80;
    server_name jpain.io www.jpain.io;

    # Kept permanently: certbot renews over HTTP-01 against this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://jpain.io$request_uri;
    }
}

# www -> apex, one canonical name (Bear served both).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;       # HTTP/3; reuseport is on the catch-all in ops/filehost
    listen [::]:443 quic;
    http2 on;
    server_name www.jpain.io;

    ssl_certificate     /etc/letsencrypt/live/jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpain.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Served-By $hostname always;   # "arctic" or "fern": whichever box answered
    return 301 https://jpain.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name jpain.io;

    ssl_certificate     /etc/letsencrypt/live/jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpain.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Kept 400 days in their own directory: the view stats are computed from
    # them (stats/blog-stats.py, logrotate-blogs).
    access_log /var/log/nginx/blogs/jpain.io.access.log filehost_json;
    error_log  /var/log/nginx/blogs/jpain.io.error.log;

    root /var/www/jpain.io;
    index index.html;
    absolute_redirect off;

    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    if ($jp_index_to) {
        return 301 $jp_index_to;
    }

    # Arctic-wide per-IP standard (see ops/filehost/nginx-filehost-limits.conf):
    # sized so no page can ever trip them -- posts must never be limited by
    # config; they only contain one IP hammering the site. limit_conn counts
    # every in-flight HTTP/2-3 request, and at 20 one browser fetching 40 files
    # over one connection got 18 x 429 (measured 2026-09-28).
    limit_req  zone=perip_read burst=500 nodelay;
    limit_conn perip_conn 256;

    charset utf-8;
    charset_types text/plain text/css text/xml application/xml text/markdown application/json
                  application/atom+xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/markdown application/xml
               application/atom+xml application/json application/javascript image/svg+xml;

    # ------------------------------------------------------------------
    # Response headers live HERE, at server level, and NO location below may
    # use add_header (any add_header in a location silently drops all of
    # these for it). Caching is set with `expires`, which is not add_header.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    # Same-origin everything. A post's live demos are .js files beside it
    # on this site, never inline script and never another origin. Posts may
    # frame their own demo pages; nothing else may frame this site.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Served-By $hostname always;   # "arctic" or "fern": whichever box answered
    add_header Vary $jp_vary always;        # empty, so absent, except on negotiated.jpg
    add_header Link $jp_md_link always;     # empty, so absent, except on /<slug>/index.md
    # GNU Terry Pratchett: a name, kept moving in the clacks (Going Postal). James asked 2026-10-08.
    add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
    add_header X-Reason $jp_x_reason always;   # these three: 404s only (see the maps)
    add_header X-Hint $jp_x_hint always;
    add_header X-Note $jp_x_note always;

    expires 10m;

    location ~ /\. { access_log off; return 404; }

    # RFC 2324, the Hyper Text Coffee Pot Control Protocol (1998): this server is a teapot.
    location ~ ^/teapot/?$ {
        default_type text/plain;
        return 418 "418 I'm a teapot.\nShort and stout. This server refuses to brew coffee (RFC 2324, section 2.3.2).\n";
    }

    # Retired slugs: the compression post was published as image-compression-colour-ceiling,
    # then game-screenshot-compression, before chroma-subsampling (2026-09-29). Search engines
    # and feed readers had both, so they redirect, lab/ and image paths included (the file
    # names didn't change). A regex, so it must stay above the image location below.
    location ~ ^/(?:image-compression-colour-ceiling|game-screenshot-compression)(?<jp_rest>/.*)?$ {
        return 301 https://jpain.io/chroma-subsampling$jp_rest;
    }

    # Bear's addresses, redirected (the Bear-era site kept them working until 2026-10).
    # Every old feed address leads to the one Atom feed; feed readers follow a 301.
    location = /feed/ { return 301 /feed.xml; }
    location = /atom/ { return 301 /feed.xml; }
    location = /rss/  { return 301 /feed.xml; }
    location ~ ^/feed/(atom|rss)\.xml$ { return 301 /feed.xml; }
    location = /blog/ { return 301 $jp_bear_tag; }

    # The raw Markdown of each post. mime.types has no entry for .md, and
    # the fallback would make browsers download it.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }
    # feed.xml and sitemap.xml: application/xml, as the AI blog always sent them.
    location ~ \.xml$ { types { } default_type application/xml; try_files $uri =404; }

    # Format negotiation, as the file host does it (ops/filehost): /<post>/negotiated.jpg
    # returns the best of negotiated.{avif,jxl,webp,jpg} for the browser's Accept header,
    # using the file host's own decision ($fh_best, conf.d/filehost-limits.conf): AVIF unless
    # Apple, then JPEG XL, then WebP, then JPEG. Must come before the image location below.
    # The capture is NAMED on purpose: evaluating $fh_best runs the file host's regex maps,
    # which overwrite $1, so a plain ([a-z0-9-]+) arrives empty (tested: every browser got 404).
    location ~ ^/(?<jp_post>[a-z0-9-]+)/negotiated\.jpg$ {
        types { image/avif avif; image/jxl jxl; image/webp webp; image/jpeg jpg; }
        expires 1d;
        try_files /$jp_post/negotiated.$fh_best /$jp_post/negotiated.jpg =404;
    }

    # Images and icons: a day (post images are not versioned either).
    location ~ \.(webp|png|jpe?g|gif|svg|avif|ico)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    # ssi fills in the address that was asked for (<!--#echo var="request_uri"
    # encoding="entity" --> in templates/404.html, HTML-escaped). This page only.
    location = /404.html { internal; ssi on; }
}
