# jpain.io -- James Pain's own blog, built by ../build.py --site ../../jpain.io.
# Installed to /etc/nginx/sites-available/jpain.io on Arctic by deploy.sh.
# Same pattern as nginx-ai.jpain.io.conf (read that first); it borrows the
# perip_read / perip_conn zones and the filehost_json log format from
# /etc/nginx/conf.d/filehost-limits.conf (ops/filehost). The log format is
# shared by every site: add fields only.
#
# URL contract, kept from Bear Blog (where the blog lived until 2026-09):
#   /<slug>/, /blog/ (and Bear's tag links /blog/?q=<tag>, filtered by site.js),
#   Atom at /feed/ and /atom/, RSS at /feed/?type=rss and /rss/, /sitemap.xml,
#   /robots.txt. New: /tags/<tag>/, and /kudos/<slug>/ for the Kudos button.
#
# Until the Let's Encrypt certificate exists, deploy.sh swaps in a self-signed
# staging pair so the whole config can be tested before DNS moves.

# The only POSTs this site takes are kudos. Everything else is GET/HEAD.
map "$request_method:$uri" $jp_method_ok {
    default                              0;
    "~^(GET|HEAD):"                      1;
    "~^POST:/kudos/[a-z0-9-]+/$"         1;
}
# Kudos POSTs per address: generous for a person, useless for a script
# (the service also counts only one per visitor per post).
map $request_method $jp_kudos_key {
    POST     $binary_remote_addr;
    default  "";
}
limit_req_zone $jp_kudos_key zone=jp_kudos:1m rate=20r/m;
# The format-negotiation demo in the compression post: its one negotiated.jpg address
# returns a different file per browser, so caches must be told (Vary). Keyed on the
# address requested ($request_uri), because $uri changes to the file actually sent.
# Sec-Fetch-Dest since 2026-09-28: the file host's decision ($fh_best) also uses it, so
# a link opened on its own in Firefox or Safari gets AVIF/JPEG XL, not the JPEG.
map $request_uri $jp_vary {
    default                          "";
    "~/negotiated\.jpg(\?|$)"        "Accept, User-Agent, Sec-Fetch-Dest";
}
# One address per page: /index.html and /<slug>/index.html redirect to / and /<slug>/.
# Keyed on $request_uri: the index directive rewrites /slug/ to /slug/index.html
# internally, so a test on $uri would redirect every page to itself.
map $request_uri $jp_index_to {
    default                                   "";
    "~^(?<jp_idx>[^?]*/)index\.html(\?.*)?$"   $jp_idx;
}
# Bear's feed URL took ?type=rss for RSS; Atom otherwise.
map $arg_type $jp_feed {
    default  /feed/atom.xml;
    rss      /feed/rss.xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name jpain.io www.jpain.io;

    # Kept permanently: certbot renews over HTTP-01 against this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://jpain.io$request_uri;
    }
}

# www -> apex, one canonical name (Bear served both).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;       # HTTP/3; reuseport is on the catch-all in ops/filehost
    listen [::]:443 quic;
    http2 on;
    server_name www.jpain.io;

    ssl_certificate     /etc/letsencrypt/live/jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpain.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Served-By $hostname always;   # "arctic" or "fern": whichever box answered
    return 301 https://jpain.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name jpain.io;

    ssl_certificate     /etc/letsencrypt/live/jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jpain.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Kept 400 days in their own directory: the view stats are computed from
    # them (stats/blog-stats.py, logrotate-blogs).
    access_log /var/log/nginx/blogs/jpain.io.access.log filehost_json;
    error_log  /var/log/nginx/blogs/jpain.io.error.log;

    root /var/www/jpain.io;
    index index.html;
    absolute_redirect off;

    client_max_body_size 1k;
    if ($jp_method_ok = 0) {
        return 405;
    }
    if ($jp_index_to) {
        return 301 $jp_index_to;
    }

    # Arctic-wide per-IP standard (see ops/filehost/nginx-filehost-limits.conf):
    # sized so no page can ever trip them -- posts must never be limited by
    # config; they only contain one IP hammering the site. limit_conn counts
    # every in-flight HTTP/2-3 request, and at 20 one browser fetching 40 files
    # over one connection got 18 x 429 (measured 2026-09-28).
    limit_req  zone=perip_read burst=500 nodelay;
    limit_conn perip_conn 256;

    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/json
                  application/atom+xml application/rss+xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/xml application/atom+xml
               application/rss+xml application/json application/javascript image/svg+xml;

    # ------------------------------------------------------------------
    # Response headers live HERE, at server level, and NO location below may
    # use add_header (any add_header in a location silently drops all of
    # these for it). Caching is set with `expires`, which is not add_header.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    # Same-origin everything. site.js and a post's live demos are .js files
    # on this site, never inline script and never another origin. Posts may
    # frame their own demo pages; nothing else may frame this site.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Served-By $hostname always;   # "arctic" or "fern": whichever box answered
    add_header Vary $jp_vary always;        # empty, so absent, except on negotiated.jpg

    expires 10m;

    location ~ /\. { access_log off; return 404; }

    # Retired slugs: the compression post was published as image-compression-colour-ceiling,
    # then game-screenshot-compression, before chroma-subsampling (2026-09-29). Search engines
    # and feed readers had both, so they redirect, lab/ and image paths included (the file
    # names didn't change). A regex, so it must stay above the image location below.
    location ~ ^/(?:image-compression-colour-ceiling|game-screenshot-compression)(?<jp_rest>/.*)?$ {
        return 301 https://jpain.io/chroma-subsampling$jp_rest;
    }

    # Feeds, at Bear's addresses and with Bear's content types.
    location = /feed/ { rewrite ^ $jp_feed last; }
    location = /atom/ { rewrite ^ /feed/atom.xml last; }
    location = /rss/  { rewrite ^ /feed/rss.xml last; }
    location = /feed/atom.xml { types { } default_type application/atom+xml; try_files $uri =404; }
    location = /feed/rss.xml  { types { } default_type application/rss+xml;  try_files $uri =404; }
    location = /sitemap.xml { types { } default_type text/xml; try_files $uri =404; }   # as Bear sent it
    location ~ \.xml$ { types { } default_type application/xml; try_files $uri =404; }

    # The Kudos button's counter (deploy/kudos, 127.0.0.1:8010). Never cached:
    # the answer depends on who asks.
    location ^~ /kudos/ {
        # A limit_req here REPLACES the server-level one rather than adding to
        # it, so the general per-address limit is repeated (at the standard
        # burst). jp_kudos is the button's own limit.
        limit_req zone=perip_read burst=500 nodelay;
        limit_req zone=jp_kudos burst=10 nodelay;
        limit_req_status 429;
        expires off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8010;
    }

    # Fonts: a year. Names are not versioned, so a changed font needs a new
    # file name, or visitors keep the old one.
    location ^~ /fonts/ { expires 1y; try_files $uri =404; }
    location = /fonts/ { return 404; }

    # Format negotiation, as the file host does it (ops/filehost): /<post>/negotiated.jpg
    # returns the best of negotiated.{avif,jxl,webp,jpg} for the browser's Accept header,
    # using the file host's own decision ($fh_best, conf.d/filehost-limits.conf): AVIF unless
    # Apple, then JPEG XL, then WebP, then JPEG. Must come before the image location below.
    # The capture is NAMED on purpose: evaluating $fh_best runs the file host's regex maps,
    # which overwrite $1, so a plain ([a-z0-9-]+) arrives empty (tested: every browser got 404).
    location ~ ^/(?<jp_post>[a-z0-9-]+)/negotiated\.jpg$ {
        types { image/avif avif; image/jxl jxl; image/webp webp; image/jpeg jpg; }
        expires 1d;
        try_files /$jp_post/negotiated.$fh_best /$jp_post/negotiated.jpg =404;
    }

    # Images and icons: a day (post images are not versioned either).
    location ~ \.(webp|png|jpe?g|gif|svg|avif|ico)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
