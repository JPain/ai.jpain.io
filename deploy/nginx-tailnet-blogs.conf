# Private blog stats at https://fern.tail09e786.ts.net/blogs/ (Tailscale only).
# Installed to /etc/nginx/snippets/tailnet-blogs.conf by deploy.sh services, and
# pulled into the tailnet vhost (ops/filehost/nginx-tailnet.conf) by its
# `include /etc/nginx/snippets/tailnet-*.conf;`, so it inherits that vhost's
# allow/deny: tailnet addresses only.
location ^~ /blogs/ {
    alias /var/www/blog-stats/;
    index index.html;
    # This location sets headers, so it carries the full set itself.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Cache-Control "no-store" always;
}
location = /blogs { return 301 /blogs/; }
