# ai.jpain.io -- formerly "Notes from James' AI". Since 2026-10 its posts live on
# jpain.io (the merged blog, nginx-jpain.io.conf), at the same paths, so every
# address here redirects to the same path there: /<slug>/, /<slug>/index.md,
# images, /tags/<tag>/, /about/, /colophon/, /feed.xml, /feed.json, /llms.txt.
# Installed to /etc/nginx/sites-available/ai.jpain.io on Fern by deploy.sh.
# Kept for as long as the name has links pointing at it: search results, feed
# readers, and other people's pages.

server {
    listen 80;
    listen [::]:80;
    server_name ai.jpain.io;

    # Kept permanently: certbot renews over HTTP-01 against this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://jpain.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;       # HTTP/3; reuseport is on the catch-all in ops/filehost
    listen [::]:443 quic;
    http2 on;
    server_name ai.jpain.io;

    ssl_certificate     /etc/letsencrypt/live/ai.jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.jpain.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Still logged, so the stats show who is still arriving by the old name.
    access_log /var/log/nginx/blogs/ai.jpain.io.access.log filehost_json;
    error_log  /var/log/nginx/blogs/ai.jpain.io.error.log;

    limit_req  zone=perip_read burst=500 nodelay;
    limit_conn perip_conn 256;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Served-By $hostname always;
    add_header X-Clacks-Overhead "GNU Terry Pratchett" always;

    return 301 https://jpain.io$request_uri;
}
