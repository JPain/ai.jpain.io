# ai.jpain.io -- "Notes from James' AI", a static site built by ../build.py.
# Installed to /etc/nginx/sites-available/ai.jpain.io on Arctic by deploy.sh.
# Modelled on ops/neverknown: it borrows the perip_read / perip_conn zones and
# the filehost_json log format from /etc/nginx/conf.d/filehost-limits.conf
# (ops/filehost). If the file host is ever removed, those move here or
# nginx -t fails. The log format is shared by every site: add fields only.
#
# Until the Let's Encrypt certificate exists, deploy.sh rewrites the two
# ssl_certificate paths to a self-signed staging pair, so the full config can
# be tested with curl --resolve before DNS moves.
#
# URL contract (from GitHub Pages, where the site lived until 2026-09):
#   /<slug>/ and /<slug>/index.md, images at /<slug>/<file>, /tags/<tag>/,
#   /about/, /colophon/, /feed.xml, /feed.json, /llms.txt, /robots.txt,
#   /sitemap.xml. A directory without its slash redirects to add it.

server {
    listen 80;
    listen [::]:80;
    server_name ai.jpain.io;

    # Kept permanently: certbot renews over HTTP-01 against this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://ai.jpain.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;       # HTTP/3; reuseport is on the catch-all in ops/filehost
    listen [::]:443 quic;
    http2 on;
    server_name ai.jpain.io;

    ssl_certificate     /etc/letsencrypt/live/ai.jpain.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.jpain.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/ai.jpain.io.access.log filehost_json;
    error_log  /var/log/nginx/ai.jpain.io.error.log;

    root /var/www/ai.jpain.io;
    index index.html;
    # Redirects say "/slug/", not "https://host/slug/", so they are right
    # whichever name or protocol the request came in on.
    absolute_redirect off;

    # A static site accepts no request bodies.
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Per-IP limits sized so no page can ever trip them, however many images
    # or demo files a post loads (James 2026-09-28: posts must not be limited).
    # They are only a guard against one IP hammering the site; capacity is not
    # the reason (load test: ops/neverknown/README.md "Load capacity").
    # limit_conn counts every in-flight HTTP/2 or HTTP/3 request as a
    # connection: at 20, one browser fetching 40 files over ONE connection got
    # 18 of them refused with 429 (measured). 256 is two connections' worth of
    # nginx's 128-streams-per-connection cap. The burst lets a 500-file page
    # load at once; the sustained 30/s is the shared perip_read zone.
    limit_req  zone=perip_read burst=500 nodelay;
    limit_conn perip_conn 256;

    # text/html always gets the charset; these need telling. Without it the
    # Markdown sources and llms.txt can show mojibake for curly quotes.
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml text/markdown application/json
                  application/atom+xml application/javascript;

    # nginx.conf only compresses text/html by default.
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/markdown application/xml
               application/atom+xml application/json application/javascript
               image/svg+xml;

    # ------------------------------------------------------------------
    # Response headers live HERE, at server level, and NO location below may
    # use add_header. Any add_header in a location cancels inheritance of
    # every one of these for that location, with no warning (the filehost
    # config shipped that bug once). Caching is set with `expires`, which is
    # not add_header, so it can vary per location.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    # Same-origin everything. script-src 'self' is there for live demos in
    # posts: a demo is a .js file beside the post, never inline script and
    # never another origin. Posts may frame their own demo pages
    # (frame-ancestors 'self'), nothing else may frame this site.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # So James can see in DevTools which host answered (asked 2026-09-28,
    # during the move from GitHub Pages). Arctic's IP is public anyway.
    add_header X-Served-By "arctic" always;

    # HTML, CSS, feeds and text: 10 minutes, what GitHub Pages sent.
    expires 10m;

    # Dotfiles are the first thing scanners ask for. None are deployed, but a
    # stray one must never be served.
    location ~ /\. { access_log off; return 404; }

    # The raw Markdown of each post. mime.types has no entry for .md, and
    # the fallback would make browsers download it.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
    }

    # feed.xml and sitemap.xml: application/xml, what GitHub Pages sent, so
    # feed readers see no change. (mime.types would say text/xml.)
    location ~ \.xml$ {
        types { }
        default_type application/xml;
        try_files $uri =404;
    }

    # Post images. Names are not versioned, so a day, not a year: a
    # replaced image shows up for everyone within 24 hours.
    location ~ \.(webp|png|jpe?g|gif|svg|avif|ico)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        # $uri/ turns /slug into a 301 to /slug/, as GitHub Pages did.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
